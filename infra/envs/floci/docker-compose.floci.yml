# ---------------------------------------------------------------------------
# TendrAI — Floci (floci.io) for local Terraform testing.
#
# MIT-licensed LocalStack alternative: no auth token, no Pro tier, all
# services unlocked. Listens on the same port 4566, so the SAME
# provider.tf in this folder works unchanged — just start this instead:
#
#   docker compose -f docker-compose.floci.yml up -d
#   terraform init && terraform plan
#   docker compose -f docker-compose.floci.yml down
#
# NOTE: do not run Floci and LocalStack at the same time — both bind 4566.
# ---------------------------------------------------------------------------

# Fixed project name so the network is always "tendrai_default"
# (reset-floci.ps1 attaches the floci-ui sidecar to it).
name: tendrai

services:
  floci:
    image: floci/floci:latest
    container_name: tendrai-floci
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - AWS_DEFAULT_REGION=ap-southeast-1
    volumes:
      - "floci-data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  floci-data:
